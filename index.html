<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demoputter</title>
<style>
:root {
  --bg: #f6f8fb;
  --bg-2: #ffffff;
  --bg-3: #f0f4fa;
  --line: #e4e9f2;
  --line-2: #d5dce8;
  --text: #1e2430;
  --dim: #65718a;
  --dim-2: #98a2b8;
  --blue: #2563eb;
  --blue-hover: #1d4fd7;
  --blue-soft: #eaf1ff;
  --green: #16a34a;
  --green-soft: #e9f9ef;
  --orange: #d97706;
  --orange-soft: #fef6e7;
  --purple: #7c3aed;
  --purple-soft: #f2ecff;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.04);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #cfd7e4; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #b6c1d4; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }

/* ===== 连接页 ===== */
.gate {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
}
.gate-card {
  width: 440px; background: #fff; border: 1px solid var(--line);
  border-radius: 16px; padding: 30px 32px; box-shadow: 0 8px 40px rgba(16,24,40,.08);
}
.gate-logo { font-weight: 800; font-size: 22px; letter-spacing: -.6px; margin-bottom: 4px; }
.gate-logo b { color: var(--blue); }
.gate-sub { color: var(--dim); font-size: 12.5px; margin-bottom: 22px; line-height: 1.6; }
.gate-card label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
.gate-card input {
  width: 100%; background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 14px;
}
.gate-card input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.10); background: #fff; }
.gate-btn {
  width: 100%; background: var(--blue); color: #fff; border-radius: 9px;
  padding: 10px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px;
}
.gate-btn:hover { background: var(--blue-hover); }
.gate-btn:disabled { opacity: .5; cursor: default; }
.gate-err { color: var(--red); font-size: 12px; min-height: 18px; margin-bottom: 6px; }
.gate-tip { color: var(--dim-2); font-size: 11.5px; line-height: 1.65; }
.gate-tip a { color: var(--blue); }

/* ===== 主界面 ===== */
.app { display: flex; height: 100vh; }

.rail {
  width: 76px; flex-shrink: 0; background: var(--bg-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 14px 0 10px;
  overflow-y: auto; overflow-x: hidden;
}
.rail::-webkit-scrollbar { width: 0; }
.logo { font-weight: 800; font-size: 12px; letter-spacing: -.3px; color: var(--text); margin-bottom: 16px; text-align: center; line-height: 1.15; flex-shrink: 0; }
.logo b { color: var(--blue); }
.rail-item {
  width: 46px; height: 46px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border-radius: 11px; margin-bottom: 4px;
  color: var(--dim-2); transition: background .16s, color .16s; position: relative;
}
.rail-item:hover { background: var(--bg-3); color: var(--dim); }
.rail-item.active { background: var(--blue-soft); color: var(--blue); }
.rail-item.active::before {
  content: ""; position: absolute; left: -13px; top: 11px; bottom: 11px;
  width: 2.5px; border-radius: 3px; background: var(--blue);
}
.rail-item svg { width: 19px; height: 19px; }
.rail-item span { font-size: 8.5px; letter-spacing: .1px; max-width: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-gap { flex: 1; min-height: 8px; }

.side {
  width: 252px; flex-shrink: 0; background: var(--bg-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.side-top { padding: 14px 12px 10px; }
.repo-switch {
  display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600;
  padding: 6px 8px; width: 100%; text-align: left; border-radius: 8px; border: 1px solid transparent;
}
.repo-switch:hover { background: var(--bg-3); border-color: var(--line); }
.repo-switch .org { color: var(--dim); font-weight: 500; }
.repo-switch .sep { color: var(--dim-2); }
.repo-switch .arrow { margin-left: auto; color: var(--dim-2); font-size: 10px; }
.search-wrap { margin-top: 9px; position: relative; }
.search-wrap input {
  width: 100%; background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 9px; padding: 7px 10px 7px 29px; font-size: 12px; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.search-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.10); background: #fff; }
.search-wrap::before { content: "⌕"; position: absolute; left: 10px; top: 4px; color: var(--dim-2); font-size: 14px; }
.side-nav { flex: 1; overflow-y: auto; padding: 8px 8px 12px; min-height: 0; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border-radius: 9px; width: 100%; text-align: left; color: var(--dim);
  font-size: 13px; margin-bottom: 1px; transition: background .14s, color .14s;
}
.nav-item:hover { background: var(--bg-3); color: var(--text); }
.nav-item.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.nav-item .ico { width: 16px; text-align: center; opacity: .85; font-size: 13px; flex-shrink: 0; }
.nav-item .cnt { margin-left: auto; font-size: 10.5px; background: var(--bg-3); color: var(--dim); padding: 1px 7px; border-radius: 99px; min-width: 22px; text-align: center; border: 1px solid var(--line); }
.nav-item.active .cnt { background: #fff; color: var(--blue); border-color: var(--blue-soft); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.tabs {
  height: 42px; flex-shrink: 0; display: flex; align-items: stretch;
  background: var(--bg-2); border-bottom: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden;
}
.tabs::-webkit-scrollbar { height: 0; }
.tab {
  display: flex; align-items: center; gap: 7px; padding: 0 14px;
  font-size: 12.5px; color: var(--dim); border-right: 1px solid var(--line);
  white-space: nowrap; position: relative; transition: background .14s, color .14s;
}
.tab:hover { background: var(--bg-3); color: var(--text); }
.tab.active { background: #fff; color: var(--text); font-weight: 600; }
.tab.active::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--blue); }
.tab .x { opacity: 0; font-size: 11px; padding: 1px 5px; border-radius: 4px; }
.tab:hover .x, .tab.active .x { opacity: .5; }
.tab .x:hover { opacity: 1; background: var(--bg-3); }
.tab-add { display: flex; align-items: center; padding: 0 15px; color: var(--dim-2); font-size: 17px; }
.tab-add:hover { color: var(--blue); }

.view { flex: 1; min-height: 0; display: none; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* 文件视图 */
.workspace { flex: 1; display: flex; min-height: 0; }
.editor-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor-bar {
  height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg-2);
}
.breadcrumb { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb .f { color: var(--text); font-weight: 500; }
.editor-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
.mini-btn {
  font-size: 11.5px; padding: 4px 11px; border-radius: 7px;
  color: var(--dim); border: 1px solid transparent;
}
.mini-btn:hover { background: var(--bg-3); color: var(--text); }
.mini-btn.primary { background: var(--blue); color: #fff; }
.mini-btn.primary:hover { background: var(--blue-hover); }
.mini-btn:disabled { opacity: .45; cursor: default; background: none; color: var(--dim); }
.code-scroll { flex: 1; overflow: auto; display: flex; min-height: 0; background: #fff; }
.gutter {
  width: 54px; flex-shrink: 0; background: #fbfcfe; color: #b6c0d0;
  font: 12.5px/1.68 var(--mono); text-align: right; padding: 14px 12px 14px 0;
  user-select: none; border-right: 1px solid var(--line); overflow: hidden;
}
.code {
  flex: 1; margin: 0; padding: 14px 20px; overflow: visible; border: none; outline: none;
  font: 12.5px/1.68 var(--mono); color: #24292f; white-space: pre; tab-size: 2;
  background: transparent; resize: none;
}
.filetree {
  width: 264px; flex-shrink: 0; border-left: 1px solid var(--line);
  background: var(--bg-2); display: flex; flex-direction: column; min-height: 0;
}
.ft-head {
  height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  padding: 0 14px; border-bottom: 1px solid var(--line);
  font-size: 11px; letter-spacing: 1.2px; color: var(--dim-2); font-weight: 600;
}
.ft-head .acts { margin-left: auto; display: flex; gap: 1px; }
.ft-body { flex: 1; overflow: auto; padding: 8px 6px 12px; font-size: 12.5px; }
.ft-row {
  display: flex; align-items: center; gap: 5px; padding: 4px 8px;
  border-radius: 7px; cursor: pointer; white-space: nowrap; color: var(--dim);
  transition: background .12s, color .12s;
}
.ft-row:hover { background: var(--bg-3); color: var(--text); }
.ft-row.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.ft-row .tw { width: 11px; color: var(--dim-2); font-size: 9px; flex-shrink: 0; }
.ft-row .fi { font-size: 11px; flex-shrink: 0; width: 14px; text-align: center; }
.ft-row .nm { overflow: hidden; text-overflow: ellipsis; }
.ft-kids { padding-left: 16px; }

/* 列表视图 */
.list-view { flex: 1; overflow: auto; padding: 20px 24px; }
.list-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.list-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.list-head .sub { font-size: 12px; color: var(--dim); }
.list-head .right { margin-left: auto; display: flex; gap: 7px; }
.btn-primary { background: var(--blue); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-ghost { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 14px; font-size: 12.5px; color: var(--dim); }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
.row-list { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 1px solid var(--line); transition: background .12s;
}
.row:last-child { border-bottom: none; }
.row.clickable { cursor: pointer; }
.row:hover { background: var(--bg-3); }
.row .num { font-family: var(--mono); font-size: 12px; color: var(--dim-2); width: 52px; flex-shrink: 0; }
.row .main-txt { flex: 1; min-width: 0; }
.row .title { font-size: 13.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
.row .meta { font-size: 11.5px; color: var(--dim-2); margin-top: 2px; }
.row .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.tag.open { background: var(--green-soft); color: var(--green); }
.tag.closed { background: var(--purple-soft); color: var(--purple); }
.tag.merged { background: var(--purple-soft); color: var(--purple); }
.tag.ok { background: var(--green-soft); color: var(--green); }
.tag.fail { background: var(--red-soft); color: var(--red); }
.tag.run { background: var(--orange-soft); color: var(--orange); }
.tag.draft { background: var(--bg-3); color: var(--dim); }
.row .who { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); flex-shrink: 0; }
.avatar {
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 9px; font-weight: 700;
}
.empty-state { text-align: center; padding: 50px 20px; color: var(--dim-2); font-size: 13px; }
.loading { text-align: center; padding: 40px; color: var(--dim-2); font-size: 13px; }

/* 设置视图 */
.settings-view { flex: 1; overflow: auto; padding: 24px; }
.settings-view h2 { margin: 0 0 4px; font-size: 17px; }
.settings-view .desc { color: var(--dim); font-size: 12.5px; margin-bottom: 20px; }
.set-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.set-card h3 { margin: 0 0 4px; font-size: 14px; }
.set-card .hint { color: var(--dim-2); font-size: 12px; margin-bottom: 14px; }
.set-field { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-field:last-child { border-bottom: none; }
.set-field label { flex: 1; font-size: 13px; }
.set-field .sub { color: var(--dim-2); font-size: 11.5px; margin-top: 1px; }
.switch { width: 42px; height: 24px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .18s; flex-shrink: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .18s; }
.switch.on { background: var(--blue); }
.switch.on::after { transform: translateX(18px); }
.set-input { width: 240px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; outline: none; }
.set-input:focus { border-color: var(--blue); }

/* 底部终端 */
.bottom { height: 160px; flex-shrink: 0; border-top: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; }
.bottom-tabs { height: 36px; flex-shrink: 0; display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.bt { display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 11.5px; color: var(--dim-2); border-right: 1px solid var(--line); }
.bt:hover { background: var(--bg-3); }
.bt.active { color: var(--text); font-weight: 600; background: #fff; box-shadow: inset 0 2px 0 var(--blue); }
.bt .cnt { font-size: 10px; background: var(--bg-3); padding: 0 6px; border-radius: 99px; color: var(--dim); }
.bottom-right { margin-left: auto; display: flex; align-items: center; gap: 7px; padding-right: 10px; }
.sel { background: var(--bg-3); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; font-size: 11px; color: var(--dim); }
.bottom-body { flex: 1; overflow: auto; padding: 11px 16px; font: 12px/1.65 var(--mono); min-height: 0; }
.term-line { color: var(--dim); }
.term-line .prompt { color: var(--green); font-weight: 600; }
.term-line .path { color: var(--blue); }
.term-line .ok { color: var(--green); }
.term-line .info { color: var(--cyan); }
.term-line .warn { color: var(--orange); }
.term-line .err { color: var(--red); }

/* 状态栏 */
.statusbar {
  height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 15px;
  padding: 0 16px; background: var(--bg-2); border-top: 1px solid var(--line);
  font-size: 10.5px; color: var(--dim-2);
}
.statusbar .kbd { background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 10px; color: var(--blue); }
.statusbar .spacer { flex: 1; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim-2); display: inline-block; margin-right: 5px; }
.dot.ok { background: var(--green); }

/* 弹窗 */
.modal-mask {
  position: fixed; inset: 0; background: rgba(16,24,40,.35); z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  width: 520px; background: #fff; border-radius: 14px; padding: 22px 24px;
  box-shadow: 0 20px 60px rgba(16,24,40,.22); max-height: 86vh; overflow: auto;
}
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal input, .modal textarea, .modal select {
  width: 100%; background: var(--bg-3); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 10px;
}
.modal textarea { min-height: 120px; font-family: var(--mono); font-size: 12px; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: var(--blue); background: #fff; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

/* 下拉 */
.dropdown {
  position: absolute; background: #fff; border: 1px solid var(--line-2);
  border-radius: 10px; box-shadow: 0 10px 30px rgba(16,24,40,.14);
  min-width: 240px; max-height: 380px; overflow: auto; z-index: 150; padding: 6px;
}
.dropdown .dd-item {
  padding: 8px 11px; border-radius: 8px; font-size: 12.5px; color: var(--dim);
  cursor: pointer; display: flex; align-items: center; gap: 7px;
}
.dropdown .dd-item:hover { background: var(--bg-3); color: var(--text); }
.dropdown .dd-item.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.dropdown .dd-sep { height: 1px; background: var(--line); margin: 5px 4px; }

.toast {
  position: fixed; right: 20px; bottom: 40px; z-index: 400;
  background: #1e2430; color: #fff; padding: 10px 16px; border-radius: 10px;
  font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
  pointer-events: none; max-width: 400px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.err { background: #b91c1c; }
.toast.ok { background: #15803d; }
</style>
</head>
<body>

<!-- 连接页 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo">demo<b>putter</b></div>
    <div class="gate-sub">一个给开发者和 AI 用的仓库工作台。填入 GitHub 个人访问令牌即可开始，令牌只存在本机。</div>
    <label>GitHub 令牌</label>
    <input id="gateToken" type="password" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <div class="gate-err" id="gateErr"></div>
    <button class="gate-btn" id="gateConnect">连接</button>
    <div class="gate-tip">在 <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> 生成经典令牌，勾选 <b>repo</b>（读写仓库）；要看工作流再勾 <b>workflow</b>。</div>
  </div>
</div>

<!-- 主界面 -->
<div class="app hidden" id="app">
  <nav class="rail" id="rail">
    <div class="logo">demo<b>putter</b></div>
    <button class="rail-item" id="railSettings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
    <div style="height:8px"></div>
    <button class="rail-item" id="railLocal" title="本地工作区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>本地</span>
    </button>
    <div id="railRepos" style="display:flex;flex-direction:column;align-items:center;"></div>
    <div class="rail-gap"></div>
    <button class="rail-item" id="railRefresh" title="刷新仓库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </nav>

  <aside class="side">
    <div class="side-top">
      <button class="repo-switch" id="repoSwitch">
        <span class="org" id="repoOwner">—</span><span class="sep">/</span><span id="repoName">—</span>
        <span class="arrow">▾</span>
      </button>
      <div class="search-wrap"><input id="searchBox" placeholder="在仓库里搜索…"></div>
    </div>
    <div class="side-nav" id="sideNav">
      <button class="nav-item active" data-view="files"><span class="ico">▤</span>文件</button>
      <button class="nav-item" data-view="commits"><span class="ico">◷</span>提交</button>
      <button class="nav-item" data-view="pulls"><span class="ico">⇄</span>拉取请求<span class="cnt" id="cntPulls"></span></button>
      <button class="nav-item" data-view="issues"><span class="ico">◎</span>问题<span class="cnt" id="cntIssues"></span></button>
      <button class="nav-item" data-view="actions"><span class="ico">▶</span>动作</button>
      <button class="nav-item" data-view="releases"><span class="ico">◇</span>发布</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙</span>设置</button>
    </div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs"></div>

    <div class="view active" id="view-files">
      <div class="workspace">
        <div class="editor-area">
          <div class="editor-bar">
            <span class="breadcrumb" id="breadcrumb">未选择文件</span>
            <div class="editor-actions">
              <button class="mini-btn" id="btnSave" disabled>保存</button>
              <button class="mini-btn primary" id="btnCommit" disabled>提交</button>
            </div>
          </div>
          <div class="code-scroll">
            <div class="gutter" id="gutter"></div>
            <textarea class="code" id="code" spellcheck="false" placeholder="从右侧文件树里点一个文件"></textarea>
          </div>
        </div>
        <div class="filetree">
          <div class="ft-head">文件
            <div class="acts">
              <button class="mini-btn" id="ftRefresh" title="刷新">↻</button>
            </div>
          </div>
          <div class="ft-body" id="fileTree"></div>
        </div>
      </div>
    </div>

    <div class="view" id="view-commits"><div class="list-view" id="listCommits"></div></div>
    <div class="view" id="view-pulls"><div class="list-view" id="listPulls"></div></div>
    <div class="view" id="view-issues"><div class="list-view" id="listIssues"></div></div>
    <div class="view" id="view-actions"><div class="list-view" id="listActions"></div></div>
    <div class="view" id="view-releases"><div class="list-view" id="listReleases"></div></div>
    <div class="view" id="view-settings"><div class="settings-view" id="viewSettings"></div></div>
    <div class="view" id="view-local"><div class="settings-view" id="localPanel"></div></div>

    <div class="bottom" id="bottom">
      <div class="bottom-tabs">
        <div class="bt active">终端</div>
        <div class="bt">问题 <span class="cnt">0</span></div>
        <div class="bt">输出</div>
        <div class="bt">调试控制台</div>
        <div class="bottom-right"><span class="sel">日志</span></div>
      </div>
      <div class="bottom-body" id="terminal"></div>
    </div>

    <div class="statusbar">
      <span><span class="dot" id="statusDot"></span><span id="statusText">已连接</span></span>
      <span id="statusRepo">—</span>
      <span class="spacer"></span>
      <span><span class="kbd">⌘K</span> 打开命令面板</span>
      <span>demoputter 0.3.0</span>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
